name: Hybrid Dialer V2 CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install all dependencies from lockfiles
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix services/realtime-sideband ci

      - name: Secret scan
        run: npm run secrets:check

      - name: Build React app
        run: npm run build

      - name: Hybrid orchestration tests
        run: npm run test:hybrid-dialer

      - name: Agent runtime tests
        run: npm run test:agent-runtime

      - name: Check Firebase Functions
        run: npm --prefix functions run check

      - name: Check Realtime sideband
        run: npm --prefix services/realtime-sideband run check
